import org.jetbrains.kotlin.gradle.dsl.JvmTarget

// Library Test App [ Gradle Script ]

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.android.gms.oss-licenses-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

android {

    compileSdk = 37

    defaultConfig {
        applicationId "com.jeovanimartinez.androidutils.app"

        minSdkVersion 24 // Android 7

        targetSdkVersion 37

        versionCode androidUtilsVersionCode
        versionName androidUtilsVersionName

        vectorDrawables.useSupportLibrary = true
        // Multidex is enabled by default for API 21 or higher (https://developer.android.com/studio/build/multidex#mdex-gradle)

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_11
        }
    }
    namespace "com.jeovanimartinez.androidutils.app"
}

dependencies {

    // General dependencies
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.core:core-ktx:1.19.1"
    implementation "com.google.android.material:material:1.14.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.2"
    implementation "androidx.core:core-splashscreen:1.2.0"

    // Firebase dependencies
    implementation "com.google.firebase:firebase-analytics:24.0.0"
    implementation "com.google.firebase:firebase-crashlytics:21.0.1"

    // Required for test premium utilities ** PENDING VERSION UPDATE **
    implementation "com.android.billingclient:billing-ktx:8.0.0"

    // Library for using a color selector
    implementation "com.jaredrummler:colorpicker:1.1.0"

    // Android Utils Library
    implementation project(":androidutils")

    // LeakCanary
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

}

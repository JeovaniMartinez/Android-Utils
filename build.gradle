// Project [ Gradle Script ]

buildscript {

    ext {

        // ** Android Utils Library Version **
        androidUtilsVersionCode = 10
        androidUtilsVersionName = "1.6.0"

        // Lint tool version (Current version of Gradle plugin is 9.5.1)
        lintVersion = '32.5.1' // The version depends of the Gradle plugin version. If the Gradle plugin version is X.Y.Z, then the Lint library version is X+23.Y.Z

        // Kotlin version
        kotlinVersion = "2.4.21"

    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath "org.jetbrains.dokka:dokka-gradle-plugin:2.3.0"
        classpath "com.google.android.gms:oss-licenses-plugin:0.13.0"
        classpath "com.google.gms:google-services:4.5.0"
        classpath "com.google.firebase:firebase-crashlytics-gradle:3.0.8"
    }

}

allprojects {

    repositories {
        google()
        mavenCentral()
    }

}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
